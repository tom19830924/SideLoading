name: Release

on:
  push:
    tags: ["v[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  tests:
    uses: ./.github/workflows/ci.yml

  release:
    name: Build and publish Release
    needs: tests
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.11.3"
      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python3 Tools/prepare_release.py --check "$RELEASE_TAG"
      - name: Prepare bundled Python
        run: ./setup_runtime.sh
      - name: Build Release App and CLI
        run: ./build_app.sh
      - name: Package release assets and Homebrew formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: .build/Runtime/bin/python3 -I -B Tools/prepare_release.py "$RELEASE_TAG"
      - name: Check relocated CLI archive
        run: |
          mkdir -p "$RUNNER_TEMP/CLI smoke test"
          tar -xzf dist/release/resign-ipa-*-macos-arm64.tar.gz -C "$RUNNER_TEMP/CLI smoke test"
          DEVELOPER_DIR=/nonexistent PATH=/usr/bin:/bin \
            "$RUNNER_TEMP/CLI smoke test/SideLoadingCLI/resign_ipa" --help
          ruby -c dist/release/resign-ipa.rb
      - name: Preserve Homebrew formula for tap job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: homebrew-formula
          path: dist/release/resign-ipa.rb
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            dist/release/*.zip dist/release/*.tar.gz dist/release/SHA256SUMS \
            --verify-tag --title "$RELEASE_TAG" --generate-notes

  tap:
    name: Test and update Homebrew tap
    needs: release
    runs-on: macos-26
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"
    steps:
      - name: Download generated formula
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: gh run download "$RUN_ID" --name homebrew-formula --dir formula
      - name: Install and test published CLI with Homebrew
        run: |
          brew tap tom19830924/tap
          cp formula/resign-ipa.rb "$(brew --repository tom19830924/tap)/Formula/resign-ipa.rb"
          brew install tom19830924/tap/resign-ipa
          brew test tom19830924/tap/resign-ipa
      - name: Check out tap with publishing credential
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: tom19830924/homebrew-tap
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap
      - name: Update tap formula
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p tap/Formula
          cp formula/resign-ipa.rb tap/Formula/resign-ipa.rb
          cd tap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Formula/resign-ipa.rb
          if ! git diff --cached --quiet; then
            git commit -m "Update resign-ipa to $RELEASE_TAG"
            git push origin HEAD:main
          fi
